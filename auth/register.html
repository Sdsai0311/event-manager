<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Portal - Register</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { max-width: 500px; margin: 50px auto; padding: 20px; }
    input, select { display: block; width: 100%; margin: 10px 0; padding: 8px; }
    button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Register</h2>
  <div id="status"></div>
  <form id="registerForm" onsubmit="handleRegister(event)">
    <input id="name" placeholder="Full Name" type="text" required>
    <input id="email" placeholder="Email" type="email" required>
    <input id="password" type="password" placeholder="Password" required>
    <select id="role" required>
      <option value="">Select Role</option>
      <option value="student">Student</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" id="registerBtn" style="opacity: 0.5;" disabled>Register</button>
  </form>
  <p><a href="login.html">Already have an account? Login here</a></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script src="../js/firebase.js"></script>
  <script>
    // Wait for Firebase to initialize
    let firebaseReady = false;
    let attempts = 0;
    const maxAttempts = 50;
    
    function checkFirebase() {
      attempts++;
      if (typeof auth !== 'undefined' && typeof db !== 'undefined') {
        firebaseReady = true;
        console.log('Firebase is ready');
        document.getElementById('registerBtn').disabled = false;
        document.getElementById('registerBtn').style.opacity = '1';
      } else if (attempts < maxAttempts) {
        setTimeout(checkFirebase, 100);
      } else {
        alert('Firebase failed to initialize. Please refresh the page.');
      }
    }
    
    checkFirebase();
    
    function handleRegister(event) {
      event.preventDefault();
      if (!firebaseReady) {
        alert('Firebase is still loading. Please wait a moment...');
        return;
      }
      register();
    }
  </script>
  <script src="../js/auth.js"></script>
</body>
</html>
