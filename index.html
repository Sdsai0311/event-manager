<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            text-align: center; 
            max-width: 600px; 
            margin: 100px auto; 
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h1 { color: #333; }
        .welcome-box { 
            background-color: #f0f0f0; 
            padding: 30px; 
            border-radius: 10px; 
            margin: 20px 0;
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            flex-wrap: wrap;
            margin-top: 20px;
        }
        a { 
            text-decoration: none; 
            padding: 12px 25px; 
            background-color: #007bff; 
            color: white; 
            border-radius: 5px; 
            transition: background-color 0.3s;
        }
        a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>College Event Portal</h1>
    <div class="welcome-box">
        <p>Welcome to the College Event Management Portal</p>
        <p>Manage events, register for activities, and download certificates</p>
    </div>

    <div id="qrcode" style="margin-top: 30px;"></div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script src="firebase.js"></script>
    <script src="attendance.js"></script>
</body>
</html>
