<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Portal - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 800px; margin: 20px auto; padding: 20px; }
    input { display: block; width: 100%; margin: 10px 0; padding: 8px; }
    button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; margin-top: 10px; }
    .event-item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
  </style>
</head>
<body>
  <h2>Admin Dashboard</h2>
  <h3>Create Event</h3>

  <input id="title" placeholder="Event Title">
  <input id="date" placeholder="Date" type="date">
  <input id="venue" placeholder="Venue">
  <button onclick="createEvent()">Create Event</button>

  <h3>Events List</h3>
  <div id="events"></div>

  <script src="firebase.js"></script>
  <script src="events.js"></script>
  <script src="attendance.js"></script>
  <script>
    auth.onAuthStateChanged(user => {
      if (!user) {
        location.href = "login.html";
      }
    });
  </script>
</body>
</html>
